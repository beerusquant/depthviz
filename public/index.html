<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Depthviz — Order Book Depth</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2307080a'/%3E%3Crect x='2' y='6' width='5' height='8' fill='%2300e676'/%3E%3Crect x='9' y='3' width='5' height='11' fill='%23ff1744'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <div class="brand">DEPTHVIZ<span class="brand-sub">ORDER BOOK DEPTH</span></div>

  <div class="group">
    <span class="lbl">MARKET</span>
    <div class="seg" id="market">
      <button class="seg-b active" data-market="spot">SPOT</button>
      <button class="seg-b" data-market="perp">PERPS</button>
    </div>
  </div>

  <div class="group">
    <div class="picker" id="ex-picker">
      <button class="btn pick" id="ex-btn"><span class="caret">&#9662;</span><span id="ex-label">BINANCE [SPOT]</span></button>
      <div class="menu" id="ex-menu"></div>
    </div>
  </div>

  <div class="group grow">
    <div class="picker grow" id="sym-picker">
      <input id="sym-input" class="sym-input" placeholder="Search symbol…" autocomplete="off" spellcheck="false">
      <div class="menu sym-menu" id="sym-menu"></div>
    </div>
    <span class="pairs" id="pairs">—</span>
  </div>

  <div class="group" id="range-g">
    <span class="lbl">RANGE</span>
    <div class="seg" id="range">
      <button class="seg-b" data-range="0.1">&pm;0.1%</button>
      <button class="seg-b" data-range="0.5">&pm;0.5%</button>
      <button class="seg-b active" data-range="2">&pm;2%</button>
      <button class="seg-b" data-range="5">&pm;5%</button>
      <button class="seg-b" data-range="10">&pm;10%</button>
    </div>
  </div>

  <div class="group right">
    <span class="live" id="live"><i class="dot"></i><b id="live-b">CONNECTING</b><span id="live-s"></span></span>
    <button class="btn icon" id="theme" title="Toggle theme">&#9728;</button>
    <button class="btn" id="copy">&#10697; COPY</button>
    <button class="btn" id="png">&#8615; PNG</button>
  </div>
</header>

<main id="stage">
  <canvas id="chart"></canvas>
  <div id="note" class="note hidden"></div>
</main>

<div id="toast" class="toast"></div>

<script type="module" src="app.js"></script>
</body>
</html>
