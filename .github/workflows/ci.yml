name: tests

# The twelve suites below need no network beyond loopback and no browser: they are the arithmetic
# the whole app rests on — the resync that decides whether accumulated depth
# survives, the sequencing engine that decides whether a book advances at all,
# the watchdog that decides whether a socket is alive, every venue's decoder and
# unit conversion replayed from recorded frames, the Hyperliquid layer stitch,
# the payload reduction, and the metrics every panel number comes from — plus one
# lifecycle contract applied to all thirteen feeds from recorded payloads, the
# ceilings that decide what a single client may hold, the health ring behind
# /api/feeds and /metrics, and the recording format a threshold is re-derived
# from. The checks that DO need the network (ccxt
# cross-check, the venue verifiers, the drift re-measurement) run hourly against the live service instead;
# they cannot live here, because a red build caused by an exchange having a bad
# minute teaches people to ignore the build.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']   # package.json declares engines >=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Runtime deps only: the tests import server/ and public/ modules, never
      # ccxt or playwright, so the install stays seconds rather than minutes.
      - run: npm ci --omit=dev
      - run: npm test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # Not a style gate. Every rule in eslint.config.js is there because it
      # catches something that passes `node --check` and then fails silently:
      # a redeclared function whose hoisted twin wins at a call site inside its
      # own temporal dead zone (which once killed every line of a page's script
      # after that point), an identifier typo in a branch that only runs when a
      # venue misbehaves, a value read across an await.
      - run: npm ci
      - run: npm run lint

  no-html-from-exchanges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Symbol names come from exchange listings and are attacker-choosable.
      # tools/smoke-ui.mjs proves the menus render them as text, but that needs a
      # browser; this is the cheap guard that the door stays shut.
      - name: no innerHTML in the front end
        run: |
          if grep -rn 'innerHTML' public/; then
            echo "::error::exchange-supplied strings must be written with textContent"
            exit 1
          fi
          echo "no innerHTML in public/"
